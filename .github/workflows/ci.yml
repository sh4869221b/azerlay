name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        shell: bash
    env:
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Install native test dependencies
        run: |
          pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection sway dbus grim noto-fonts-cjk noto-fonts-emoji
          setcap -r /usr/bin/sway

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false

      - name: Prepare Go cache keys
        id: cache-key
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/test-ci-go-cache-key.sh
          bash scripts/ci-go-cache-key.sh "$RUNNER_TEMP/go-cache-environment.txt" | tee -a "$GITHUB_OUTPUT"

      - name: Restore test build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/azerlay-go-build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      # Module caching stays job-local; cross-job sharing belongs to #116.
      - name: Restore test module cache
        id: module-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/azerlay-go-mod
          key: azerlay-test-mod-v1-${{ steps.cache-key.outputs.compatibility }}-${{ steps.cache-key.outputs.dependencies }}

      - name: Record cache restore
        env:
          BUILD_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
          BUILD_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: |
          printf 'Build cache exact hit: %s\nRestored key: %s\n' "$BUILD_HIT" "$BUILD_KEY" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          du -sb "$GOCACHE" "$GOMODCACHE"

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [[ -n $files ]]; then
            printf 'Files require gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test
        run: |
          useradd --create-home --user-group azerlay-test
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          chown -R azerlay-test:azerlay-test "$GITHUB_WORKSPACE" "$GOCACHE" "$GOMODCACHE"
          # Restored tar ownership is not assumed to match this fresh user.
          runuser -u azerlay-test -- test -r "$GOCACHE"
          runuser -u azerlay-test -- test -w "$GOCACHE"
          runuser -u azerlay-test -- env PATH="$PATH" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" scripts/test-wayland.sh go test -race -shuffle=on -count=1 ./...

      - name: Build
        run: go build ./cmd/azerlay

      - name: Record normal and race GTK cache state
        run: |
          for mode in normal race; do
            flags=()
            if [[ $mode == race ]]; then flags=(-race); fi
            printf 'GTK cache state (%s):\n' "$mode"
            go list "${flags[@]}" -deps -f '{{if .Module}}{{if eq .Module.Path "github.com/diamondburned/gotk4/pkg"}}{{.ImportPath}} stale={{.Stale}} reason={{.StaleReason}}{{end}}{{end}}' ./cmd/azerlay | sed '/^$/d'
          done
          du -sb "$GOCACHE" "$GOMODCACHE"

      # The test job is the only producer of this namespace, after normal AND
      # race compilation and every test-job gate succeeds. PR caches remain in
      # GitHub's merge-ref scope; they are never promoted to main.
      - name: Save test build cache
        if: >-
          success() && steps.build-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
           github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v4
        with:
          path: /tmp/azerlay-go-build
          key: ${{ steps.cache-key.outputs.key }}

      - name: Save test module cache
        if: >-
          success() && steps.module-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
           github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v4
        with:
          path: /tmp/azerlay-go-mod
          key: azerlay-test-mod-v1-${{ steps.cache-key.outputs.compatibility }}-${{ steps.cache-key.outputs.dependencies }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Fuzz existing parsing stages
        shell: bash
        run: |
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzNormalizeOuterText$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeBase64$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeLZMAEnvelope$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeMsgpackString$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzParseRoot$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileraw -run='^$' -fuzz='^FuzzParse$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileadapter -run='^$' -fuzz='^FuzzNormalize$' -fuzztime=10s -parallel=1 -timeout=2m

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            .git/ci-native-cache-input

      - name: Build and run binary
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go version
          go build -o /tmp/azerlay ./cmd/azerlay
          /tmp/azerlay version

  cgo-smoke:
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native build dependencies
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            .git/ci-native-cache-input

      - name: Compile and inspect native binary
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkg-config --modversion gtk4 gtk4-layer-shell-0
          CGO_ENABLED=1 go build -o /tmp/azerlay ./cmd/azerlay
          /tmp/azerlay version
          readelf -d /tmp/azerlay

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native build dependencies
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            .git/ci-native-cache-input

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable vulnerabilities
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          govulncheck ./...

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native build dependencies
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            .git/ci-native-cache-input

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Report dependency licenses
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go-licenses report ./... --include_tests --ignore=github.com/sh4869221b/azerlay > "$RUNNER_TEMP/dependency-licenses.csv"

      - name: Upload dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: ${{ runner.temp }}/dependency-licenses.csv
          if-no-files-found: error
          retention-days: 7

  generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Regenerate LZMA boundary fixtures
        run: go run ./internal/profiledecode/testdata/generate

      - name: Check generated fixtures
        run: git diff --exit-code -- internal/profiledecode/testdata/zeros-64mib.lzma internal/profiledecode/testdata/zeros-64mib-plus-one.lzma
