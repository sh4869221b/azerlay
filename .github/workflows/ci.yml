name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/sh4869221b/azerlay-ci@sha256:1450369c2712232c76b779159aade3cf9b3f642d47229419be0392a5cb093e13
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      CI_NATIVE_IMAGE: ghcr.io/sh4869221b/azerlay-ci@sha256:1450369c2712232c76b779159aade3cf9b3f642d47229419be0392a5cb093e13
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Verify prebuilt native dependencies
        run: |
          set -euo pipefail
          diff -u /usr/local/share/azerlay-ci/packages.txt <(LC_ALL=C pacman -Q | LC_ALL=C sort)
          pkg-config --exists gtk4 gtk4-layer-shell-0
          command -v cc readelf zstd
          test -z "$(getcap /usr/bin/sway)"
          pacman -Q sway dbus grim noto-fonts-cjk noto-fonts-emoji

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\nimage=%s\n' "$CI_CACHE_JOB" "$CI_NATIVE_IMAGE"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          tool-cache: 'true'

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [[ -n $files ]]; then
            printf 'Files require gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go vet ./...

      - name: Install Staticcheck
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          source .github/ci-tools.env
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          du -sb "$GOMODCACHE/cache/download"

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test
        run: |
          useradd --create-home --user-group azerlay-test
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          chown -R azerlay-test:azerlay-test "$GITHUB_WORKSPACE" "$GOCACHE" "$GOMODCACHE"
          runuser -u azerlay-test -- env PATH="$PATH" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" scripts/test-wayland.sh go test -race -shuffle=on -count=1 ./...

      - name: Build
        run: go build ./cmd/azerlay

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Fuzz existing parsing stages
        shell: bash
        run: |
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzNormalizeOuterText$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeBase64$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeLZMAEnvelope$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeMsgpackString$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzParseRoot$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileraw -run='^$' -fuzz='^FuzzParse$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileadapter -run='^$' -fuzz='^FuzzNormalize$' -fuzztime=10s -parallel=1 -timeout=2m

  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/sh4869221b/azerlay-ci@sha256:aacdcd375e205ee1c104f1d9c101d037adfe7f7e51164123b1eabcbba64bf128
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      CI_NATIVE_IMAGE: ghcr.io/sh4869221b/azerlay-ci@sha256:aacdcd375e205ee1c104f1d9c101d037adfe7f7e51164123b1eabcbba64bf128
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Verify prebuilt native dependencies
        run: |
          set -euo pipefail
          diff -u /usr/local/share/azerlay-ci/packages.txt <(LC_ALL=C pacman -Q | LC_ALL=C sort)
          pkg-config --exists gtk4 gtk4-layer-shell-0
          command -v cc readelf zstd

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\nimage=%s\n' "$CI_CACHE_JOB" "$CI_NATIVE_IMAGE"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          module-writer: 'true'

      - name: Build, run, and inspect native binary
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          # The former default-CGo build and explicit-CGo smoke must agree.
          # Fail on drift rather than silently dropping a distinct build condition.
          test "$(go env CGO_ENABLED)" = 1
          pkg-config --modversion gtk4 gtk4-layer-shell-0
          CGO_ENABLED=1 go build -o /tmp/azerlay ./cmd/azerlay
          /tmp/azerlay version
          readelf -d /tmp/azerlay

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/sh4869221b/azerlay-ci@sha256:aacdcd375e205ee1c104f1d9c101d037adfe7f7e51164123b1eabcbba64bf128
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      CI_NATIVE_IMAGE: ghcr.io/sh4869221b/azerlay-ci@sha256:aacdcd375e205ee1c104f1d9c101d037adfe7f7e51164123b1eabcbba64bf128
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Verify prebuilt native dependencies
        run: |
          set -euo pipefail
          diff -u /usr/local/share/azerlay-ci/packages.txt <(LC_ALL=C pacman -Q | LC_ALL=C sort)
          pkg-config --exists gtk4 gtk4-layer-shell-0
          command -v cc readelf zstd

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\nimage=%s\n' "$CI_CACHE_JOB" "$CI_NATIVE_IMAGE"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          tool-cache: 'true'

      - name: Install govulncheck
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          source .github/ci-tools.env
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          du -sb "$GOMODCACHE/cache/download"

      - name: Check reachable vulnerabilities
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          govulncheck ./...

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/sh4869221b/azerlay-ci@sha256:aacdcd375e205ee1c104f1d9c101d037adfe7f7e51164123b1eabcbba64bf128
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    env:
      CI_NATIVE_IMAGE: ghcr.io/sh4869221b/azerlay-ci@sha256:aacdcd375e205ee1c104f1d9c101d037adfe7f7e51164123b1eabcbba64bf128
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Verify prebuilt native dependencies
        run: |
          set -euo pipefail
          diff -u /usr/local/share/azerlay-ci/packages.txt <(LC_ALL=C pacman -Q | LC_ALL=C sort)
          pkg-config --exists gtk4 gtk4-layer-shell-0
          command -v cc readelf zstd

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\nimage=%s\n' "$CI_CACHE_JOB" "$CI_NATIVE_IMAGE"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          tool-cache: 'true'

      - name: Install go-licenses
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          source .github/ci-tools.env
          go install github.com/google/go-licenses/v2@"$GO_LICENSES_VERSION"
          du -sb "$GOMODCACHE/cache/download"

      - name: Report dependency licenses
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go-licenses report ./... --include_tests --ignore=github.com/sh4869221b/azerlay > "$RUNNER_TEMP/dependency-licenses.csv"

      - name: Upload dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: ${{ runner.temp }}/dependency-licenses.csv
          if-no-files-found: error
          retention-days: 7

  generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Regenerate LZMA boundary fixtures
        run: go run ./internal/profiledecode/testdata/generate

      - name: Check generated fixtures
        run: git diff --exit-code -- internal/profiledecode/testdata/zeros-64mib.lzma internal/profiledecode/testdata/zeros-64mib-plus-one.lzma
