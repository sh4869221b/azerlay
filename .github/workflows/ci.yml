name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        shell: bash
    env:
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Install native test dependencies
        run: |
          pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip zstd base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection sway dbus grim noto-fonts-cjk noto-fonts-emoji
          setcap -r /usr/bin/sway

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          tool-cache: 'true'

      - name: Check complete package partition and core dependencies
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci_check_packages.py

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [[ -n $files ]]; then
            printf 'Files require gofmt:\n%s\n' "$files"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go vet ./...

      - name: Install Staticcheck
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          source .github/ci-tools.env
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          du -sb "$GOMODCACHE/cache/download"

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test
        id: native_race
        run: |
          set -euo pipefail
          useradd --create-home --user-group azerlay-test
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          chown -R azerlay-test:azerlay-test "$GITHUB_WORKSPACE" "$GOCACHE" "$GOMODCACHE"
          mapfile -t native < scripts/ci-native-packages.txt
          printf 'diagnostic_dir=%s\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/native-race-timing.json" -- \
            runuser -u azerlay-test -- env PATH="$PATH" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" scripts/test-wayland.sh go test -race -json -shuffle=on -count=1 "${native[@]}" \
            | tee "$RUNNER_TEMP/native-race-tests.jsonl"

      - name: Upload native race diagnostics
        if: ${{ always() && (steps.native_race.outcome == 'success' || steps.native_race.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: native-race-json-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.native_race.outputs.diagnostic_dir }}/native-race-tests.jsonl
            ${{ steps.native_race.outputs.diagnostic_dir }}/native-race-timing.json
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: go build ./cmd/azerlay

      # Bounded candidate validation, not twenty workflow runs or a timing sample.
      - name: Stress native capture and isolated CLI fixtures
        id: cli_stress
        run: |
          set -euo pipefail
          printf 'diagnostic_dir=%s\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/cli-stress-timing.json" -- \
            runuser -u azerlay-test -- env PATH="$PATH" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" scripts/test-wayland.sh go test -race -json -shuffle=on -count=3 -run '^Test(CLIInputForms|RunLiveOverlayNative|RunLiveOverlayLatency)$' ./cmd/azerlay \
            | tee "$RUNNER_TEMP/cli-stress-tests.jsonl"

      - name: Upload CLI stress diagnostics
        if: ${{ always() && (steps.cli_stress.outcome == 'success' || steps.cli_stress.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-stress-json-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.cli_stress.outputs.diagnostic_dir }}/cli-stress-tests.jsonl
            ${{ steps.cli_stress.outputs.diagnostic_dir }}/cli-stress-timing.json
          if-no-files-found: error
          retention-days: 7

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Fuzz existing parsing stages
        shell: bash
        run: |
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzNormalizeOuterText$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeBase64$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeLZMAEnvelope$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeMsgpackString$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzParseRoot$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileraw -run='^$' -fuzz='^FuzzParse$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileadapter -run='^$' -fuzz='^FuzzNormalize$' -fuzztime=10s -parallel=1 -timeout=2m

  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    defaults:
      run:
        shell: bash
    env:
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip zstd base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          module-writer: 'true'

      - name: Build, run, and inspect native binary
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          # The former default-CGo build and explicit-CGo smoke must agree.
          # Fail on drift rather than silently dropping a distinct build condition.
          test "$(go env CGO_ENABLED)" = 1
          pkg-config --modversion gtk4 gtk4-layer-shell-0
          CGO_ENABLED=1 go build -o /tmp/azerlay ./cmd/azerlay
          /tmp/azerlay version
          readelf -d /tmp/azerlay

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base
    defaults:
      run:
        shell: bash
    env:
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Install native build dependencies
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip zstd base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          tool-cache: 'true'

      - name: Install govulncheck
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          source .github/ci-tools.env
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          du -sb "$GOMODCACHE/cache/download"

      - name: Check reachable vulnerabilities
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          govulncheck ./...

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base
    defaults:
      run:
        shell: bash
    env:
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Install native build dependencies
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip zstd base-devel pkgconf gtk4 gtk4-layer-shell gobject-introspection

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          {
            printf 'job=%s\n' "$CI_CACHE_JOB"
            LC_ALL=C pacman -Q | LC_ALL=C sort
          } > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          tool-cache: 'true'

      - name: Install go-licenses
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          source .github/ci-tools.env
          go install github.com/google/go-licenses/v2@"$GO_LICENSES_VERSION"
          du -sb "$GOMODCACHE/cache/download"

      - name: Report dependency licenses
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go-licenses report ./... --include_tests --ignore=github.com/sh4869221b/azerlay > "$RUNNER_TEMP/dependency-licenses.csv"

      - name: Upload dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: ${{ runner.temp }}/dependency-licenses.csv
          if-no-files-found: error
          retention-days: 7

  generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test CI measurement tools
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      # The exact manifest union is checked by test. Core race tests run here;
      # production GTK/Wayland and process tests remain in the native test job.
      - name: Validate and test core without CGo
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t core < scripts/ci-core-packages.txt
          go env GOOS GOARCH CGO_ENABLED CC GOCACHE
          python3 scripts/ci_check_packages.py --core-only
          go test -shuffle=on -count=1 "${core[@]}"

      - name: Validate and race-test core without GUI setup
        id: core_race
        shell: bash
        run: |
          set -euo pipefail
          # setup-go's Ubuntu cache has no complete native ABI fingerprint.
          # Keep core CGo/race cold, step-local and outside that cache.
          race_cache=$(mktemp -d "$RUNNER_TEMP/azerlay-core-race.XXXXXX")
          trap 'rm -rf "$race_cache"' EXIT
          export GOCACHE="$race_cache" CGO_ENABLED=1
          mapfile -t core < scripts/ci-core-packages.txt
          go env GOOS GOARCH CGO_ENABLED CC GOCACHE
          python3 scripts/ci_check_packages.py --core-only
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/core-race-timing.json" -- \
            go test -race -json -shuffle=on -count=1 "${core[@]}" \
            | tee "$RUNNER_TEMP/core-race-tests.jsonl"
          # Pure test-only PNG helper, no TestMain or GTK substitute. Retain the
          # separate real native capture suite above; disclose this stress count.
          go test -race -shuffle=on -count=20 cmd/azerlay/run_live_capture_test.go
          go test -race -shuffle=on -count=20 -run '^TestControlTimeoutClient$' ./internal/control

      - name: Upload core race diagnostics
        if: ${{ always() && (steps.core_race.outcome == 'success' || steps.core_race.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: core-race-json-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core-race-tests.jsonl
            ${{ runner.temp }}/core-race-timing.json
          if-no-files-found: error
          retention-days: 7

      - name: Regenerate LZMA boundary fixtures
        run: go run ./internal/profiledecode/testdata/generate

      - name: Check generated fixtures
        run: git diff --exit-code -- internal/profiledecode/testdata/zeros-64mib.lzma internal/profiledecode/testdata/zeros-64mib-plus-one.lzma
