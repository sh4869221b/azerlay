name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [[ -n $files ]]; then
            printf 'Files require gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Build
        run: go build ./cmd/azerlay

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Fuzz existing parsing stages
        shell: bash
        run: |
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzNormalizeOuterText$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeBase64$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeLZMAEnvelope$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeMsgpackString$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzParseRoot$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileraw -run='^$' -fuzz='^FuzzParse$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileadapter -run='^$' -fuzz='^FuzzNormalize$' -fuzztime=10s -parallel=1 -timeout=2m

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, archlinux:base]
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu build dependencies
        if: matrix.image == 'ubuntu:24.04'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git curl tar gzip build-essential

      - name: Install Arch build dependencies
        if: matrix.image == 'archlinux:base'
        run: pacman -Syu --noconfirm --needed ca-certificates git curl tar gzip base-devel

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false

      - name: Build and run binary
        run: |
          go version
          go build -o /tmp/azerlay ./cmd/azerlay
          /tmp/azerlay version

  cgo-smoke:
    runs-on: ubuntu-latest
    env:
      GTK_BRIDGE_IMPLEMENTED: 'false'
    steps:
      - name: Explain missing GTK compile coverage
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          GTK/CGo compile smoke is **skipped** under Issue #36's documented exception:
          no production GTK/gotk4/gtk4-layer-shell bridge exists yet.
          When that bridge is introduced, replace the disabled step with native
          dependency installation and actual compilation. This informational job
          does not demonstrate native compile coverage.
          EOF

      # Issue #36 permits this skip until the production GTK/layer-shell bridge exists.
      - name: GTK/CGo compile smoke (skipped - production bridge absent)
        if: env.GTK_BRIDGE_IMPLEMENTED == 'true'
        run: echo 'Replace with native dependency installation and bridge compilation.'

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable vulnerabilities
        run: govulncheck ./...

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Report dependency licenses
        run: go-licenses report ./... --include_tests --ignore=github.com/sh4869221b/azerlay > "$RUNNER_TEMP/dependency-licenses.csv"

      - name: Upload dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: ${{ runner.temp }}/dependency-licenses.csv
          if-no-files-found: error
          retention-days: 7

  generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Regenerate LZMA boundary fixtures
        run: go run ./internal/profiledecode/testdata/generate

      - name: Check generated fixtures
        run: git diff --exit-code -- internal/profiledecode/testdata/zeros-64mib.lzma internal/profiledecode/testdata/zeros-64mib-plus-one.lzma
