name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794
    defaults:
      run:
        shell: bash
    env:
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Bootstrap snapshot CA with verified official package
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://snapshot.ubuntu.com/ubuntu/20261001T000000Z/pool/main/c/ca-certificates/ca-certificates_20260601~26.04.1_all.deb';
            const expected = '6077d27c6b6f8b23590cb01ff877ed8c804a67a5442cc32b5a33da10d2bd0e90';
            const response = await fetch(url);
            if (!response.ok) throw new Error(`CA bootstrap download failed: ${response.status}`);
            const data = Buffer.from(await response.arrayBuffer());
            const actual = require('crypto').createHash('sha256').update(data).digest('hex');
            if (data.length !== 138514 || actual !== expected) throw new Error('CA bootstrap integrity mismatch');
            require('fs').writeFileSync('/tmp/azerlay-bootstrap-ca.deb', data);

      - name: Install pinned Ubuntu test dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          dpkg-deb -x /tmp/azerlay-bootstrap-ca.deb /tmp/azerlay-bootstrap-ca
          cat /tmp/azerlay-bootstrap-ca/usr/share/ca-certificates/mozilla/*.crt > /tmp/azerlay-bootstrap-ca.pem
          printf 'Acquire::https::CAInfo "/tmp/azerlay-bootstrap-ca.pem";\nAPT::Get::Always-Include-Phased-Updates "true";\n' > /etc/apt/apt.conf.d/00azerlay-snapshot
          # Fixed, signed archive closure. No live apt sources or insecure flags.
          rm -f /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/ubuntu.sources
          cat > /etc/apt/sources.list.d/azerlay.sources <<'SOURCES'
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/20261001T000000Z/
          Suites: resolute resolute-updates resolute-security
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          apt-get update --error-on=any
          # Verify the exact signed metadata as well as APT's signature checks.
          while read -r suite expected; do
            indexes=(/var/lib/apt/lists/*_dists_"$suite"_InRelease)
            test "${#indexes[@]}" = 1
            printf '%s  %s\n' "$expected" "${indexes[0]}" | sha256sum --check
          done <<'INDEXES'
          resolute 45f95ce276cdba3e41870516a130e03c58b8b7a79e9546b0efe9e526d255740c
          resolute-updates 802e675dd9de4c7f3916434a95e7c1d8eec0e82886622d7805ab19a2c6fe0365
          resolute-security 1d5041572116a8b23aabf79ac7439ad8af83d57ad3fb0f9aa0d4523ec10c5908
          INDEXES
          apt-get indextargets --format '$(URI)' > /tmp/azerlay-apt-index-uris
          test -s /tmp/azerlay-apt-index-uris
          if grep -v '^https://snapshot\.ubuntu\.com/ubuntu/20261001T000000Z/' /tmp/azerlay-apt-index-uris; then
            printf 'Unexpected non-snapshot APT source\n' >&2
            exit 1
          fi
          apt-get -y dist-upgrade
          apt-get install -y --no-install-recommends ca-certificates git curl tar gzip zstd build-essential pkg-config libgtk-4-dev libgtk4-layer-shell-dev gobject-introspection libgirepository-1.0-dev python3 sway dbus grim fonts-noto-cjk fonts-noto-color-emoji libcap2-bin
          apt-get check
          audit=$(dpkg --audit)
          test -z "$audit"
          # Ubuntu may ship sway without a capability; do not mask other errors.
          if [[ -n $(getcap /usr/bin/sway) ]]; then setcap -r /usr/bin/sway; fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare native Go cache input
        id: native_environment
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          bash scripts/ci-native-fingerprint.sh > .git/ci-native-cache-input

      - name: Set up Go and native caches
        uses: ./.github/actions/native-go-cache
        with:
          tool-cache: 'true'

      - name: Check complete package partition and core dependencies
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci_check_packages.py

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [[ -n $files ]]; then
            printf 'Files require gofmt:\n%s\n' "$files"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go vet ./...

      - name: Install Staticcheck
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          source .github/ci-tools.env
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          du -sb "$GOMODCACHE/cache/download"

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test
        id: native_race
        run: |
          set -euo pipefail
          useradd --create-home --user-group azerlay-test
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          chown -R azerlay-test:azerlay-test "$GITHUB_WORKSPACE" "$GOCACHE" "$GOMODCACHE"
          mapfile -t native < scripts/ci-native-packages.txt
          printf 'diagnostic_dir=%s\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/native-race-timing.json" -- \
            runuser -u azerlay-test -- env PATH="$PATH" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" scripts/test-wayland.sh go test -race -json -shuffle=on -count=1 "${native[@]}" \
            | tee "$RUNNER_TEMP/native-race-tests.jsonl"

      - name: Upload native race diagnostics
        if: ${{ always() && (steps.native_race.outcome == 'success' || steps.native_race.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: native-race-json-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.native_race.outputs.diagnostic_dir }}/native-race-tests.jsonl
            ${{ steps.native_race.outputs.diagnostic_dir }}/native-race-timing.json
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: go build ./cmd/azerlay

      - name: Retain complete native environment fingerprint
        if: ${{ always() && steps.native_environment.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-environment-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: .git/ci-native-cache-input
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Fuzz existing parsing stages
        shell: bash
        run: |
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzNormalizeOuterText$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeBase64$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeLZMAEnvelope$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeMsgpackString$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzParseRoot$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileraw -run='^$' -fuzz='^FuzzParse$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileadapter -run='^$' -fuzz='^FuzzNormalize$' -fuzztime=10s -parallel=1 -timeout=2m

