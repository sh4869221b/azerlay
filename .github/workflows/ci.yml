name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Normal PR/main gates use pinned Nix. Latest Arch runs independently each day
# and through the explicit pre-release verification entrypoint.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI_NIX_ROLE: test
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner comparison metadata
        run: |
          set -euo pipefail
          printf 'logical_cpu_count=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          awk -F: '/model name/{sub(/^ +/, "", $2); print "cpu_model=" $2; exit}' /proc/cpuinfo
          grep '^MemTotal:' /proc/meminfo

      - name: Initialize isolated Nix job paths
        run: |
          set -euo pipefail
          printf 'CI_NIX_STATE=%s/azerlay-nix-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CI_NIX_OUTPUT=%s/azerlay-nix-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install verified official Nix runtime
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-install-time.json" -- \
            bash scripts/ci-nix-install.sh

      - name: Prepare locked binary-substituted native environment
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-prepare-time.json" -- \
            python3 scripts/ci_nix_prepare.py --role "$CI_NIX_ROLE" --output "$CI_NIX_OUTPUT"

      - name: Prepare complete Nix Go cache fingerprint
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command \
            bash scripts/ci-nix-run.sh bash scripts/ci-nix-fingerprint.sh > .git/ci-native-cache-input

      - name: Restore isolated Nix Go caches
        uses: ./.github/actions/nix-go-cache
        with:
          tool-cache: 'true'

      - name: Check complete package partition and formatting
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            python3 scripts/ci_check_packages.py
            files=$(gofmt -l .)
            if [[ -n $files ]]; then
              printf "Files require gofmt:\n%s\n" "$files"
              gofmt -d .
              exit 1
            fi
          '

      - name: Vet
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            go vet ./...
          '

      - name: Install Staticcheck
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            bash scripts/ci-install-staticcheck.sh
            du -sb "$GOMODCACHE/cache/download"
          '

      - name: Staticcheck
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            staticcheck ./...
          '

      - name: Test native race and Wayland integration
        id: native_race
        run: |
          set -euo pipefail
          mapfile -t native < scripts/ci-native-packages.txt
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh \
            python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-native-race-timing.json" -- \
            scripts/test-wayland.sh go test -race -json -shuffle=on -count=1 "${native[@]}" \
            | tee "$RUNNER_TEMP/nix-native-race-tests.jsonl"

      - name: Retain Nix native race diagnostics
        if: ${{ always() && (steps.native_race.outcome == 'success' || steps.native_race.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: nix-native-race-json-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nix-native-race-tests.jsonl
            ${{ runner.temp }}/nix-native-race-timing.json
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            go build ./cmd/azerlay
          '

      - name: Retain Nix setup and closure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nix-environment-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: |
            .git/ci-native-cache-input
            ${{ runner.temp }}/nix-install-time.json
            ${{ runner.temp }}/nix-prepare-time.json
            ${{ runner.temp }}/azerlay-nix-output/nix-version.txt
            ${{ runner.temp }}/azerlay-nix-output/versions.json
            ${{ runner.temp }}/azerlay-nix-output/dependency-installables.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-derivation.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-result.json
            ${{ runner.temp }}/azerlay-nix-output/closure.json
            ${{ runner.temp }}/azerlay-nix-output/closure-paths.txt
            ${{ runner.temp }}/azerlay-nix-output/lock-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7


  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner comparison metadata
        run: |
          set -euo pipefail
          printf 'logical_cpu_count=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          awk -F: '/model name/{sub(/^ +/, "", $2); print "cpu_model=" $2; exit}' /proc/cpuinfo
          grep '^MemTotal:' /proc/meminfo

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Fuzz existing parsing stages
        shell: bash
        run: |
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzNormalizeOuterText$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeBase64$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeLZMAEnvelope$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzDecodeMsgpackString$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profiledecode -run='^$' -fuzz='^FuzzParseRoot$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileraw -run='^$' -fuzz='^FuzzParse$' -fuzztime=10s -parallel=1 -timeout=2m
          go test ./internal/profileadapter -run='^$' -fuzz='^FuzzNormalize$' -fuzztime=10s -parallel=1 -timeout=2m


  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI_NIX_ROLE: build
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner comparison metadata
        run: |
          set -euo pipefail
          printf 'logical_cpu_count=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          awk -F: '/model name/{sub(/^ +/, "", $2); print "cpu_model=" $2; exit}' /proc/cpuinfo
          grep '^MemTotal:' /proc/meminfo

      - name: Initialize isolated Nix job paths
        run: |
          set -euo pipefail
          printf 'CI_NIX_STATE=%s/azerlay-nix-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CI_NIX_OUTPUT=%s/azerlay-nix-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install verified official Nix runtime
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-install-time.json" -- \
            bash scripts/ci-nix-install.sh

      - name: Prepare locked binary-substituted native environment
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-prepare-time.json" -- \
            python3 scripts/ci_nix_prepare.py --role "$CI_NIX_ROLE" --output "$CI_NIX_OUTPUT"

      - name: Prepare complete Nix Go cache fingerprint
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command \
            bash scripts/ci-nix-run.sh bash scripts/ci-nix-fingerprint.sh > .git/ci-native-cache-input

      - name: Restore isolated Nix Go caches
        uses: ./.github/actions/nix-go-cache
        with:
          tool-cache: 'false'
          module-writer: 'true'

      - name: Build, run, and inspect Nix native binary
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            go version
            go env GOOS GOARCH CGO_ENABLED CC
            test "$(go env CGO_ENABLED)" = 1
            pkg-config --modversion gtk4 gtk4-layer-shell-0
            CGO_ENABLED=1 go build -o /tmp/azerlay ./cmd/azerlay
            /tmp/azerlay version
            readelf -d /tmp/azerlay
          '

      - name: Retain Nix setup and closure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nix-environment-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: |
            .git/ci-native-cache-input
            ${{ runner.temp }}/nix-install-time.json
            ${{ runner.temp }}/nix-prepare-time.json
            ${{ runner.temp }}/azerlay-nix-output/nix-version.txt
            ${{ runner.temp }}/azerlay-nix-output/versions.json
            ${{ runner.temp }}/azerlay-nix-output/dependency-installables.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-derivation.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-result.json
            ${{ runner.temp }}/azerlay-nix-output/closure.json
            ${{ runner.temp }}/azerlay-nix-output/closure-paths.txt
            ${{ runner.temp }}/azerlay-nix-output/lock-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7


  vulnerability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI_NIX_ROLE: build
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner comparison metadata
        run: |
          set -euo pipefail
          printf 'logical_cpu_count=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          awk -F: '/model name/{sub(/^ +/, "", $2); print "cpu_model=" $2; exit}' /proc/cpuinfo
          grep '^MemTotal:' /proc/meminfo

      - name: Initialize isolated Nix job paths
        run: |
          set -euo pipefail
          printf 'CI_NIX_STATE=%s/azerlay-nix-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CI_NIX_OUTPUT=%s/azerlay-nix-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install verified official Nix runtime
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-install-time.json" -- \
            bash scripts/ci-nix-install.sh

      - name: Prepare locked binary-substituted native environment
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-prepare-time.json" -- \
            python3 scripts/ci_nix_prepare.py --role "$CI_NIX_ROLE" --output "$CI_NIX_OUTPUT"

      - name: Prepare complete Nix Go cache fingerprint
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command \
            bash scripts/ci-nix-run.sh bash scripts/ci-nix-fingerprint.sh > .git/ci-native-cache-input

      - name: Restore isolated Nix Go caches
        uses: ./.github/actions/nix-go-cache
        with:
          tool-cache: 'true'

      - name: Install govulncheck
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            source .github/ci-tools.env
            go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
            du -sb "$GOMODCACHE/cache/download"
          '

      - name: Check reachable vulnerabilities
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            govulncheck ./...
          '

      - name: Retain Nix setup and closure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nix-environment-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: |
            .git/ci-native-cache-input
            ${{ runner.temp }}/nix-install-time.json
            ${{ runner.temp }}/nix-prepare-time.json
            ${{ runner.temp }}/azerlay-nix-output/nix-version.txt
            ${{ runner.temp }}/azerlay-nix-output/versions.json
            ${{ runner.temp }}/azerlay-nix-output/dependency-installables.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-derivation.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-result.json
            ${{ runner.temp }}/azerlay-nix-output/closure.json
            ${{ runner.temp }}/azerlay-nix-output/closure-paths.txt
            ${{ runner.temp }}/azerlay-nix-output/lock-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7


  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI_NIX_ROLE: build
      GOCACHE: /tmp/azerlay-go-build
      GOMODCACHE: /tmp/azerlay-go-mod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner comparison metadata
        run: |
          set -euo pipefail
          printf 'logical_cpu_count=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          awk -F: '/model name/{sub(/^ +/, "", $2); print "cpu_model=" $2; exit}' /proc/cpuinfo
          grep '^MemTotal:' /proc/meminfo

      - name: Initialize isolated Nix job paths
        run: |
          set -euo pipefail
          printf 'CI_NIX_STATE=%s/azerlay-nix-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CI_NIX_OUTPUT=%s/azerlay-nix-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install verified official Nix runtime
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-install-time.json" -- \
            bash scripts/ci-nix-install.sh

      - name: Prepare locked binary-substituted native environment
        run: |
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/nix-prepare-time.json" -- \
            python3 scripts/ci_nix_prepare.py --role "$CI_NIX_ROLE" --output "$CI_NIX_OUTPUT"

      - name: Prepare complete Nix Go cache fingerprint
        env:
          CI_CACHE_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command \
            bash scripts/ci-nix-run.sh bash scripts/ci-nix-fingerprint.sh > .git/ci-native-cache-input

      - name: Restore isolated Nix Go caches
        uses: ./.github/actions/nix-go-cache
        with:
          tool-cache: 'true'

      - name: Install go-licenses
        env:
          GOMODCACHE: /tmp/azerlay-tool-go-mod
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            source .github/ci-tools.env
            go install github.com/google/go-licenses/v2@"$GO_LICENSES_VERSION"
            du -sb "$GOMODCACHE/cache/download"
          '

      - name: Report dependency licenses
        run: |
          nix develop --no-update-lock-file ".#ci-$CI_NIX_ROLE" --command bash scripts/ci-nix-run.sh bash -c '
            set -euo pipefail
            go-licenses report ./... --include_tests --ignore=github.com/sh4869221b/azerlay > "$RUNNER_TEMP/nix-dependency-licenses.csv"
          '

      - name: Retain Nix dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: nix-dependency-licenses
          path: ${{ runner.temp }}/nix-dependency-licenses.csv
          if-no-files-found: error
          retention-days: 7

      - name: Retain Nix setup and closure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nix-environment-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: |
            .git/ci-native-cache-input
            ${{ runner.temp }}/nix-install-time.json
            ${{ runner.temp }}/nix-prepare-time.json
            ${{ runner.temp }}/azerlay-nix-output/nix-version.txt
            ${{ runner.temp }}/azerlay-nix-output/versions.json
            ${{ runner.temp }}/azerlay-nix-output/dependency-installables.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-derivation.json
            ${{ runner.temp }}/azerlay-nix-output/devshell-result.json
            ${{ runner.temp }}/azerlay-nix-output/closure.json
            ${{ runner.temp }}/azerlay-nix-output/closure-paths.txt
            ${{ runner.temp }}/azerlay-nix-output/lock-sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  generated-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner comparison metadata
        run: |
          set -euo pipefail
          printf 'logical_cpu_count=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          printf 'runner_image=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          awk -F: '/model name/{sub(/^ +/, "", $2); print "cpu_model=" $2; exit}' /proc/cpuinfo
          grep '^MemTotal:' /proc/meminfo

      - name: Test CI measurement tools
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Verify exact Go notices and reviewed license texts
        run: python3 scripts/go_notices.py --check

      # The exact manifest union is checked by test. Core race tests run here;
      # production GTK/Wayland and process tests remain in the native test job.
      - name: Validate and test core without CGo
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t core < scripts/ci-core-packages.txt
          go env GOOS GOARCH CGO_ENABLED CC GOCACHE
          python3 scripts/ci_check_packages.py --core-only
          go test -shuffle=on -count=1 "${core[@]}"

      - name: Validate and race-test core without GUI setup
        id: core_race
        shell: bash
        run: |
          set -euo pipefail
          # setup-go's Ubuntu cache has no complete native ABI fingerprint.
          # Keep core CGo/race cold, step-local and outside that cache.
          race_cache=$(mktemp -d "$RUNNER_TEMP/azerlay-core-race.XXXXXX")
          trap 'rm -rf "$race_cache"' EXIT
          export GOCACHE="$race_cache" CGO_ENABLED=1
          mapfile -t core < scripts/ci-core-packages.txt
          go env GOOS GOARCH CGO_ENABLED CC GOCACHE
          python3 scripts/ci_check_packages.py --core-only
          python3 scripts/ci_time_command.py --output "$RUNNER_TEMP/core-race-timing.json" -- \
            go test -race -json -shuffle=on -count=1 "${core[@]}" \
            | tee "$RUNNER_TEMP/core-race-tests.jsonl"

      - name: Upload core race diagnostics
        if: ${{ always() && (steps.core_race.outcome == 'success' || steps.core_race.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: core-race-json-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core-race-tests.jsonl
            ${{ runner.temp }}/core-race-timing.json
          if-no-files-found: error
          retention-days: 7

      - name: Regenerate LZMA boundary fixtures
        run: go run ./internal/profiledecode/testdata/generate

      - name: Check generated fixtures
        run: git diff --exit-code -- internal/profiledecode/testdata/zeros-64mib.lzma internal/profiledecode/testdata/zeros-64mib-plus-one.lzma
