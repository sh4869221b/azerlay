name: Build private CI image

on:
  workflow_dispatch:
  # Temporary bootstrap: removed before this candidate is proposed for merge.
  push:
    branches: [perf/arch-ci-image-115]
    paths: ['.github/ci-image/**', '.github/workflows/ci-image.yml']

permissions:
  contents: read

concurrency:
  group: azerlay-ci-image-publisher
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'sh4869221b/azerlay' && github.ref == 'refs/heads/perf/arch-ci-image-115'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect package access without changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/users/sh4869221b/packages/container/azerlay-ci > "$RUNNER_TEMP/package.json"
          mkdir -p "$RUNNER_TEMP/image-evidence"
          jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json"
          jq '{id, name, visibility, repository: .repository.full_name}' "$RUNNER_TEMP/package.json" > "$RUNNER_TEMP/image-evidence/package-access.json"
          export DOCKER_CONFIG="$RUNNER_TEMP/azerlay-registry-auth"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for target in native wayland; do
            if [[ "$target" == native ]]; then digest=sha256:aacdcd375e205ee1c104f1d9c101d037adfe7f7e51164123b1eabcbba64bf128; else digest=sha256:1450369c2712232c76b779159aade3cf9b3f642d47229419be0392a5cb093e13; fi
            image="ghcr.io/sh4869221b/azerlay-ci@$digest"
            start=$(date +%s)
            docker pull "$image"
            echo "$(( $(date +%s) - start ))" > "$RUNNER_TEMP/image-evidence/${target}-recovery-pull-seconds.txt"
            docker image inspect "$image" --format '{{.Size}}' > "$RUNNER_TEMP/image-evidence/${target}-bytes.txt"
            docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}' | grep -Fx 'https://github.com/sh4869221b/azerlay'
            docker run --rm "$image" cat /usr/local/share/azerlay-ci/packages.txt > "$RUNNER_TEMP/image-evidence/${target}-packages.txt"
            docker manifest inspect "$image" | jq '[.layers[].size] | add' > "$RUNNER_TEMP/image-evidence/${target}-compressed-bytes.txt"
            printf '%s\n' "$image" > "$RUNNER_TEMP/image-evidence/${target}-digest.txt"
          done
          echo a36e8c1b4a77489ec97f1f1233f0a5a06ca2b465 > "$RUNNER_TEMP/image-evidence/source-sha.txt"
      - name: Upload recovered image provenance
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-evidence
          path: ${{ runner.temp }}/image-evidence/
          if-no-files-found: error
          retention-days: 14
