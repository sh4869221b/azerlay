name: Native Go caches
description: Share downloaded modules while isolating compiled native results.
inputs:
  module-writer:
    description: Only native-build may publish the shared application module snapshot.
    default: 'false'
  tool-cache:
    description: Analyzer graph (staticcheck, govulncheck, go-licenses), or false.
    default: 'false'
  build-profile:
    description: Compiled snapshot contents (normal or race); independent of job names.
    default: 'normal'
runs:
  using: composite
  steps:
    - name: Set up Go
      id: go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
        cache: false

    - name: Check cache paths and compression
      shell: bash
      run: |
        set -euo pipefail
        test "$GOMODCACHE" = /tmp/azerlay-go-mod
        test "$GOCACHE" = /tmp/azerlay-go-build
        # Identical paths and compression are part of the GitHub cache version.
        command -v zstd

    # Save archives and integrity metadata, not both zips and extracted sources.
    # go mod download/go install reconstruct sources through Go's normal checks.
    - name: Prepare effective cache settings
      shell: bash
      run: |
        set -euo pipefail
        test -s .git/ci-native-cache-input
        bash scripts/ci-go-build-settings.sh >> .git/ci-native-cache-input

    - name: Prepare analyzer module identity
      if: inputs.tool-cache != 'false'
      shell: bash
      env:
        CI_CACHE_TOOL: ${{ inputs.tool-cache }}
      run: bash scripts/ci-tool-fingerprint.sh "$CI_CACHE_TOOL" > .git/ci-tool-cache-input

    - name: Restore shared Go modules
      id: modules
      uses: actions/cache/restore@v6
      with:
        path: /tmp/azerlay-go-mod/cache/download
        key: azerlay-mod-v3-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}

    - name: Restore native Go build cache
      uses: actions/cache@v6
      with:
        path: /tmp/azerlay-go-build
        # Arch native build dependency closure and effective Go/compiler settings.
        # No restore prefix may cross that compatibility boundary.
        key: azerlay-build-v3-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ inputs.build-profile }}-${{ hashFiles('go.mod', 'go.sum', '.git/ci-native-cache-input') }}

    - name: Download and verify application modules
      shell: bash
      run: bash scripts/ci-go-modules.sh

    - name: Save shared Go modules
      if: inputs.module-writer == 'true' && steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: /tmp/azerlay-go-mod/cache/download
        key: ${{ steps.modules.outputs.cache-primary-key }}

    - name: Restore pinned tool modules
      if: inputs.tool-cache != 'false'
      uses: actions/cache@v6
      with:
        path: /tmp/azerlay-tool-go-mod/cache/download
        # Go analyzer graph only; native packages and Syft do not affect downloads.
        key: azerlay-tool-mod-v3-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('.git/ci-tool-cache-input') }}
